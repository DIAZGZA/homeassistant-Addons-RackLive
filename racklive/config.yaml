name: "RackLive"
description: "Panel de control y monitorizacion de infraestructura de red RackLive integrado en Home Assistant."
version: "1.0.0"
slug: "racklive"
init: false
arch:
  - amd64
startup: "services"
boot: "auto"
panel_icon: "mdi:server-network"
panel_title: "RackLive"
ingress: true
ingress_port: 8000
options:
  log_level: "info"
schema:
  log_level: "str(trace|debug|info|warning|error|fatal|panic)"
ports:
  8000/tcp: 8000
