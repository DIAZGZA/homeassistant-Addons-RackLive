name: "RackLive"
description: "Panel de control y monitorizacion de infraestructura de red RackLive integrado en Home Assistant."
version: "1.0.4"
slug: "racklive"
init: false
arch:
  - aarch64
  - amd64
  - armv7
startup: "services"
boot: "auto"
panel_icon: "mdi:server-network"
panel_title: "RackLive"
ingress: true
ingress_port: 8080
options:
  log_level: "info"
schema:
  log_level: "list(trace|debug|info|warning|error|fatal|panic)"
ports:
  8080/tcp: 8080
